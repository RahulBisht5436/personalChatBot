[project]
name = "streamingbackend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rahul Bisht" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langgraph>=1.2.11",
    "langchain-openai>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "openai>=2.45.0,<3.0.0",
    "pypdf>=5.0.0",
    "pymupdf>=1.25.0",
    "chromadb>=0.6.0",
    "python-dotenv>=1.0.0",
    "guardrails-ai>=0.11.0",
    "guardrails-ai-detect-pii>=0.0.6",
    "guardrails-ai-toxic-language>=0.0.2",
]

[project.scripts]
serve = "streamingbackend.cli:serve"
ingest-rag = "streamingbackend.cli:ingest_rag"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
