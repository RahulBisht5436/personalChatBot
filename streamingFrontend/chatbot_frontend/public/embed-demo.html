<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embed Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        background: #f4f4f5;
        color: #18181b;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Third-party website demo</h1>
      <p>
        This page simulates any external website embedding your chatbot with a
        single script tag.
      </p>
    </main>

    <script
      src="/embed.js"
      data-widget-origin="http://localhost:3000"
      data-api-url="http://127.0.0.1:8000"
      async
    ></script>
  </body>
</html>
